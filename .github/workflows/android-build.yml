name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          sdk-version: 34
          accept-licenses: yes

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "platforms;android-25"
          sdkmanager "build-tools;34.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x ./android_app/gradlew

      - name: Build with Gradle
        run: ./android_app/gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4  # <-- CHANGED FROM v3 TO v4
        with:
          name: hebrewbooks-app-debug
          path: android_app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
